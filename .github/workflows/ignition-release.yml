name: Ignition core release

# Builds the cores Ignition ships and publishes them on ignition-v* tags.
# Kept separate from upstream's build-*-libretro.yml so rebases never touch it.

on:
  workflow_dispatch:
  push:
    tags: ["ignition-v*"]

jobs:
  macos:
    runs-on: macos-26
    # action-gh-release writes; the workflow token defaults to read-only.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        # RelWithDebInfo so a crash names its line. HAVE_PIPE2=0 keeps bundled
        # curl off pipe2, which newer macOS SDKs expose only above Dolphin's
        # 11.0 deployment target and -Werror turns into a build failure.
        run: |
          cmake -B build \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHAVE_PIPE2=0

      - name: Build
        run: cmake --build build --target dolphin_libretro -j "$(sysctl -n hw.ncpu)"

      - name: Package (buildbot layout)
        run: |
          cd build
          zip -j dolphin_libretro.dylib.zip dolphin_libretro.dylib

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin_libretro-macos-arm64
          path: build/dolphin_libretro.dylib.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ignition-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dolphin_libretro.dylib.zip

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Ubuntu 22.04 for its glibc (2.35), which is the floor Ignition's own
    # Linux packaging targets (packaging/linux/Dockerfile). A core built on
    # the runner's own image links a glibc that only equally-new distros have,
    # and then fails to load inside the AppImage everywhere else. The image
    # is old enough that its cmake (3.22) and gcc (11) are both below what
    # Dolphin needs, so the two come from elsewhere.
    container: ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: gcc-12
      CXX: g++-12
    steps:
      - name: Install toolchain and dependencies
        # Ubuntu 22.04 is here for its glibc and ships neither a new enough
        # cmake nor a new enough gcc, so both come from third parties. That is
        # two network dependencies this build cannot do without, and they fail
        # from time to time -- so they fail loudly here rather than four steps
        # later. A transient fetch once produced an empty key and the only
        # symptom was "gpg: no valid OpenPGP data found".
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            software-properties-common gpg gpg-agent curl ca-certificates
          add-apt-repository -y ppa:ubuntu-toolchain-r/test
          curl -fsSL --retry 5 --retry-connrefused --retry-delay 3 \
            https://apt.kitware.com/keys/kitware-archive-latest.asc \
            -o /tmp/kitware.asc
          [ -s /tmp/kitware.asc ] || { echo "Kitware key came back empty" >&2; exit 1; }
          gpg --dearmor < /tmp/kitware.asc > /usr/share/keyrings/kitware-archive-keyring.gpg
          [ -s /usr/share/keyrings/kitware-archive-keyring.gpg ] \
            || { echo "Kitware key did not dearmor" >&2; exit 1; }
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ jammy main' \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config git curl unzip zip \
            gcc-12 g++-12 \
            libasound2-dev libpulse-dev \
            libx11-dev libxi-dev libxrandr-dev libudev-dev libevdev-dev \
            libegl1-mesa-dev libgl1-mesa-dev \
            libbluetooth-dev libsystemd-dev

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check the toolchain is what the build needs
        # Cheaper to find out here than at minute nineteen of a compile.
        run: |
          set -euo pipefail
          cmake --version | head -1
          gcc-12 --version | head -1
          ldd --version | head -1

      - name: Trust the checkout
        # The container runs as a different user than the checkout is owned by,
        # so git refuses the repo and `dolphin_scmrev` falls back to a version
        # string with no commit in it. The core then reports itself as stock.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Configure
        # USE_SYSTEM_LIBS=OFF and a static libstdc++ are what make the result
        # a core other distros can load. Left to itself the build links the
        # image's own curl, mbedtls and krb5 by SONAME -- names that differ on
        # Fedora and Arch -- and GCC 12's libstdc++, which Ubuntu 22.04 does
        # not itself ship. Both turn "built against an old glibc" into a lie.
        #
        # --exclude-libs,ALL is the other half, and without it the first half
        # is a trap. A static libstdc++ whose symbols stay global collides with
        # a host that has its own: Godot's Linux binary links libstdc++
        # statically and is linked -rdynamic, so its C++ runtime sits in the
        # process's global scope, and dlopening this core then crashes in
        # __cxxabiv1 RTTI the moment the host has a rendering device. Headless
        # hosts survive it, which is why it took a windowed run to find.
        run: |
          cmake -B build -G Ninja \
            -DLIBRETRO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LIBS=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc -Wl,--exclude-libs,ALL"

      - name: Build
        run: cmake --build build --target dolphin_libretro -j "$(nproc)"

      - name: Package (buildbot layout)
        run: |
          cd build
          zip -j dolphin_libretro.so.zip dolphin_libretro.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dolphin_libretro-linux-x64
          path: build/dolphin_libretro.so.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/ignition-v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/dolphin_libretro.so.zip
